[package]
name = "kinavis-ros2"
description = "ROS 2 for the KINAVIS navigation crates: NavSatFix, Imu, Odometry and GeoPoint mirrors with the NED to ENU and FRD to FLU conversions and covariances, without an allocator."
documentation = "https://docs.rs/kinavis-ros2"
readme = "README.md"
keywords = ["ros2", "robotics", "navsatfix", "rep-103", "no-std"]
categories = ["science::robotics", "no-std::no-alloc", "science::geo"]
# Satellite crate, versioned independently of the kernel.
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE-*"]

[features]
default = ["std"]
# Standard library maths in the kernel.
std = ["kinavis-kernel/std"]
# Pure-Rust `libm`, for `no_std` targets.
libm = ["kinavis-kernel/libm"]

[dependencies]
# Kernel only: the nodes and rclrs live in KINAVIS/ros2-kinavis.
kinavis-kernel = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
