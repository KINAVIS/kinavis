[package]
name = "kinavis-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Separate workspace, built only by cargo-fuzz.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
kinavis = { path = "..", default-features = false, features = ["std", "serde"] }

[[bin]]
name = "serde_route"
path = "fuzz_targets/serde_route.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde_table"
path = "fuzz_targets/serde_table.rs"
test = false
doc = false
bench = false
