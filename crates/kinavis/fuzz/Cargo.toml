[package]
name = "kinavis-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Separate workspace, built only by cargo-fuzz.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `float_roundtrip`: exact float parsing, so a written value reads back bit-identical.
serde_json = { version = "1", features = ["float_roundtrip"] }
kinavis = { path = "..", default-features = false, features = ["std", "serde"] }

[[bin]]
name = "serde_route"
path = "fuzz_targets/serde_route.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde_table"
path = "fuzz_targets/serde_table.rs"
test = false
doc = false
bench = false
