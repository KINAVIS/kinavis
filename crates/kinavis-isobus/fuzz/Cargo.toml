[package]
name = "kinavis-isobus-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Separate workspace, built only by cargo-fuzz.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kinavis-isobus = { path = "..", default-features = false, features = ["std"] }
kinavis-j1939 = { path = "../../kinavis-j1939", default-features = false, features = ["std"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
