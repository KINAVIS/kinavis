[package]
name = "kinavis-isobus"
description = "ISOBUS (ISO 11783-7) for the KINAVIS navigation crates: wheel-based, ground-based and machine selected speed, and the guidance messages, without an allocator."
documentation = "https://docs.rs/kinavis-isobus"
readme = "README.md"
keywords = ["isobus", "iso11783", "agriculture", "can", "no-std"]
categories = ["embedded", "no-std::no-alloc", "parser-implementations"]
# Satellite crate, versioned independently of the kernel.
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE-*"]

[features]
default = ["std"]
# Standard library in the kernel.
std = ["kinavis-kernel/std", "kinavis-j1939/std"]
# Pure-Rust `libm`, for `no_std` targets.
libm = ["kinavis-kernel/libm", "kinavis-j1939/libm"]
# Serialisation of the messages.
serde = ["dep:serde", "kinavis-kernel/serde", "kinavis-j1939/serde"]

[dependencies]
# The kernel's units, and the J1939 frame ISOBUS is built on.
kinavis-kernel = { workspace = true }
kinavis-j1939 = { version = "0.1.0", path = "../kinavis-j1939", default-features = false }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
