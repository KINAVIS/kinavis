[package]
name = "kinavis-ais-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Separate workspace, built only by cargo-fuzz.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kinavis-ais = { path = "..", default-features = false, features = ["std"] }
kinavis-nmea0183 = { path = "../../kinavis-nmea0183", default-features = false, features = ["std"] }
kinavis-kernel = { path = "../../kinavis-kernel", default-features = false, features = ["std"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "assemble"
path = "fuzz_targets/assemble.rs"
test = false
doc = false
bench = false
