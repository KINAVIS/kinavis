[package]
name = "kinavis-ubx"
description = "The u-blox UBX binary protocol for the KINAVIS navigation crates: framing, navigation, satellites, sensor fusion, without an allocator."
documentation = "https://docs.rs/kinavis-ubx"
readme = "README.md"
keywords = ["ublox", "ubx", "gnss", "rtk", "no-std"]
categories = ["science::geo", "no-std::no-alloc", "parser-implementations"]
# Satellite crate, versioned independently of the kernel.
version = "0.1.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE-*"]

[features]
default = ["std"]
# Standard library floating-point maths.
std = ["kinavis-kernel/std"]
# Pure-Rust `libm`, for `no_std` targets.
libm = ["kinavis-kernel/libm"]

[dependencies]
# Kernel only.
kinavis-kernel = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
