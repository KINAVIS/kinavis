[package]
name = "kinavis-agri-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Separate workspace, built only by cargo-fuzz.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: exact float parsing, so a written value reads back bit-identical.
serde_json = { version = "1", features = ["float_roundtrip"] }
kinavis-agri = { path = "..", default-features = false, features = ["std", "serde"] }
kinavis = { path = "../../kinavis", default-features = false, features = ["std"] }
kinavis-kernel = { path = "../../kinavis-kernel", default-features = false, features = ["std"] }

[[bin]]
name = "serde_guidance"
path = "fuzz_targets/serde_guidance.rs"
test = false
doc = false
bench = false
