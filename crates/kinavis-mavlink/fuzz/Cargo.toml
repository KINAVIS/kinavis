[package]
name = "kinavis-mavlink-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Separate workspace, built only by cargo-fuzz.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kinavis-mavlink = { path = "..", default-features = false, features = ["std", "signing"] }

[[bin]]
name = "deframe"
path = "fuzz_targets/deframe.rs"
test = false
doc = false
bench = false
