# Configuration for `cargo deny check`, run in CI.
#
# Library crates have no dependencies by default (`libm` and `serde` are
# optional); this file keeps new dependencies an explicit decision.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Add entries only with a reason.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
